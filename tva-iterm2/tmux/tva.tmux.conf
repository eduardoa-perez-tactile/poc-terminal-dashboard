# TVA-inspired tmux look and defaults.

set -g default-terminal "screen-256color"
set -g mouse on
set -g history-limit 200000
set -g status-position top
set -g status-justify centre
set -g status-interval 5
set -g status-style "bg=#0f0f0c,fg=#f2b632"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[fg=#f2b632,bg=#0f0f0c,bold] TVA CONSOLE #[default]"
set -g status-right "#[fg=#8b8b78,bg=#0f0f0c] %Y-%m-%d #[fg=#f2b632,bold] %H:%M #[default]"

set -g pane-border-style "fg=#3a3a31"
set -g pane-active-border-style "fg=#f2b632"
set -g message-style "bg=#2b2b2b,fg=#f2b632"
set -g mode-style "bg=#2b2b2b,fg=#f2b632"

setw -g window-status-format " #[fg=#8b8b78]#I:#W#[default] "
setw -g window-status-current-format " #[fg=#0f0f0c,bg=#f2b632,bold]#I:#W#[default] "
setw -g clock-mode-colour "colour214"

# Box-like pane title bar.
set -g pane-border-format " #[fg=#8b8b78]PANE #{pane_index} #[default]"
set -g pane-border-status top

# Optional quick launcher for the dashboard layout.
bind-key D run-shell "~/.tmux/tva-dashboard.sh"
