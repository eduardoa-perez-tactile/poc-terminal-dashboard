<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <pattern id="scan" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="5" fill="rgba(0,0,0,0.00)"/>
      <rect y="5" width="6" height="1" fill="rgba(255,143,31,0.10)"/>
    </pattern>
    <pattern id="noise" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="4" r="0.8" fill="rgba(255,143,31,0.08)"/>
      <circle cx="11" cy="7" r="0.6" fill="rgba(255,143,31,0.06)"/>
