<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="rgba(0,0,0,0.00)"/>
      <rect y="2" width="4" height="1" fill="rgba(0,0,0,0.06)"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.00)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.08)"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#scan)"/>
  <rect width="1600" height="900" fill="url(#vignette)"/>
</svg>
