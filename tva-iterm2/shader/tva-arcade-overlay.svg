  <rect width="1920" height="1080" fill="rgba(0,0,0,0.00)"/>
  <rect x="12" y="12" width="1896" height="1056" fill="none" stroke="rgba(255,143,31,0.84)" stroke-width="6"/>
  <rect x="28" y="28" width="1864" height="1024" fill="none" stroke="rgba(255,143,31,0.55)" stroke-width="2"/>

