  <rect x="40" y="40" width="1840" height="920" fill="url(#glow)"/>

  <rect x="40" y="962" width="1840" height="72" fill="url(#footer)" stroke="rgba(255,143,31,0.70)" stroke-width="2"/>
  <text x="64" y="1008" fill="rgba(255,143,31,0.88)" font-family="IBM Plex Mono, monospace" font-size="30" letter-spacing="2">TVA  FILE  EDIT  VIEW  MODE  HELP</text>

